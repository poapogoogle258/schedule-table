services:
  postgres:
    image: postgres
    container_name: schedule_table_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=adminpoap0
      - POSTGRES_DB=schedule_table
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - schedule_table_network

networks:
  schedule_table_network:
    driver: bridge

volumes:
  postgres_data:
